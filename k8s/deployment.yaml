# K8s manifests para deploy LOCAL em k3d/kind.
apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  namespace: oficina
data:
  NODE_ENV: "production"
  PORT: "3003"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.messaging.svc.cluster.local:5672"
  OTEL_SERVICE_NAME: "fiap-fase4-execution-service"
---
apiVersion: v1
kind: Secret
metadata:
  name: execution-service-secrets
  namespace: oficina
type: Opaque
stringData:
  MONGODB_URL: "mongodb://execution:execution@mongodb.data.svc.cluster.local:27017/execution_db?authSource=admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: oficina
  labels:
    app: execution-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      containers:
        - name: app
          image: fiap-fase4-execution-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
              name: http
          envFrom:
            - configMapRef:
                name: execution-service-config
            - secretRef:
                name: execution-service-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
  namespace: oficina
spec:
  type: ClusterIP
  selector:
    app: execution-service
  ports:
    - port: 80
      targetPort: 3003
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execution-service-hpa
  namespace: oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: execution-service
  namespace: oficina
spec:
  rules:
    - host: execution.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: execution-service
                port:
                  number: 80
